name: Publish approved silent loop
on:
  push:
    paths: ['.github/workflows/approved-motion.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install approved media and page
        run: |
          curl -fL 'https://github.com/user-attachments/files/34919531/1-shwcase-motion.zip' -o /tmp/approved.zip
          echo 'ce91ca55fa63d5a9d764e21d2d9accd361be90563c009029b8a4a2566829b6f6  /tmp/approved.zip' | sha256sum -c -
          unzip -o /tmp/approved.zip -d .
          git config user.name 'joshuapepper09'
          git config user.email '282503845+joshuapepper09@users.noreply.github.com'
          git add app/page.tsx public/shwcase-coastal-dusk-loop.mp4
          git rm .github/workflows/approved-motion.yml
          git commit -m 'Publish approved silent coastal dusk loop'
          git push
