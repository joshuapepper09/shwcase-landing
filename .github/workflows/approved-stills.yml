name: Publish approved stills
on:
  push:
    paths: ['.github/workflows/approved-stills.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install approved media and page
        run: |
          curl -fL 'https://github.com/user-attachments/files/34901596/1-approved-stills.zip' -o /tmp/approved.zip
          echo '427741df701ff0904dbda12e36f48725b8cc7154081537d75b1c78d8daadd20b  /tmp/approved.zip' | sha256sum -c -
          unzip -o /tmp/approved.zip -d .
          git config user.name 'joshuapepper09'
          git config user.email '282503845+joshuapepper09@users.noreply.github.com'
          git add app/page.tsx public/shwcase-still-*.jpg
          git rm .github/workflows/approved-stills.yml
          git commit -m 'Publish approved original stills and neutral editorial captions'
          git push
