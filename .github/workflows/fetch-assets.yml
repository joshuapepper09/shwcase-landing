name: fetch hero assets
on:
  push:
    branches:
      - v2-redesign
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-redesign
      - name: download assets
        run: |
          curl -sL -A 'Mozilla/5.0' -o public/shwcase-pier.mp4 'https://github.com/user-attachments/assets/2d18c948-d3da-4339-bb5f-e9074a341789'
          curl -sL -A 'Mozilla/5.0' -o public/shwcase-pier-poster.jpg 'https://github.com/user-attachments/assets/b445caeb-8646-47b5-9336-ddd82d252151'
          file public/shwcase-pier.mp4 public/shwcase-pier-poster.jpg
      - name: commit assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/shwcase-pier.mp4 public/shwcase-pier-poster.jpg
          git commit -m 'add pier clip + poster for video hero'
          git push origin v2-redesign
